<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g stroke="#0a0d09" fill="none" stroke-linecap="butt">
    <!-- scope tube bezel -->
    <circle cx="100" cy="100" r="94" stroke-width="1.2" stroke-opacity="0.65"/>
    <circle cx="100" cy="100" r="89" stroke-width="0.6" stroke-opacity="0.4"/>

    <!-- heavy duplex posts at the edge, thinning to a fine crosshair -->
    <line x1="100" y1="6"   x2="100" y2="46"  stroke-width="2.6"/>
    <line x1="6"   y1="100" x2="46"  y2="100" stroke-width="2.6"/>
    <line x1="154" y1="100" x2="194" y2="100" stroke-width="2.6"/>
    <line x1="100" y1="154" x2="100" y2="194" stroke-width="2.6"/>

    <!-- fine crosshair, gapped at the aiming point -->
    <line x1="100" y1="46"  x2="100" y2="96"  stroke-width="0.7"/>
    <line x1="46"  y1="100" x2="96"  y2="100" stroke-width="0.7"/>
    <line x1="104" y1="100" x2="154" y2="100" stroke-width="0.7"/>
    <line x1="100" y1="104" x2="100" y2="154" stroke-width="0.7"/>

    <!-- windage scale: major tick every 6 units, minor every 3 -->
    <g stroke-width="0.55">
      <line x1="94"  y1="97.6" x2="94"  y2="102.4"/>
      <line x1="88"  y1="97.6" x2="88"  y2="102.4"/>
      <line x1="82"  y1="97.6" x2="82"  y2="102.4"/>
      <line x1="76"  y1="97.6" x2="76"  y2="102.4"/>
      <line x1="70"  y1="97.6" x2="70"  y2="102.4"/>
      <line x1="106" y1="97.6" x2="106" y2="102.4"/>
      <line x1="112" y1="97.6" x2="112" y2="102.4"/>
      <line x1="118" y1="97.6" x2="118" y2="102.4"/>
      <line x1="124" y1="97.6" x2="124" y2="102.4"/>
      <line x1="130" y1="97.6" x2="130" y2="102.4"/>
    </g>
    <g stroke-width="0.4">
      <line x1="97"  y1="98.6" x2="97"  y2="101.4"/>
      <line x1="91"  y1="98.6" x2="91"  y2="101.4"/>
      <line x1="85"  y1="98.6" x2="85"  y2="101.4"/>
      <line x1="79"  y1="98.6" x2="79"  y2="101.4"/>
      <line x1="73"  y1="98.6" x2="73"  y2="101.4"/>
      <line x1="103" y1="98.6" x2="103" y2="101.4"/>
      <line x1="109" y1="98.6" x2="109" y2="101.4"/>
      <line x1="115" y1="98.6" x2="115" y2="101.4"/>
      <line x1="121" y1="98.6" x2="121" y2="101.4"/>
      <line x1="127" y1="98.6" x2="127" y2="101.4"/>
    </g>

    <!-- hold-under marks above centre, for targets nearer than the zero -->
    <g stroke-width="0.5">
      <line x1="97.4" y1="94" x2="102.6" y2="94"/>
      <line x1="98.2" y1="88" x2="101.8" y2="88"/>
    </g>

    <!-- Bullet-drop compensation ladder: one labelled step per 100 m out to
         600 m, at 6 units per step, with half-step ticks between for odd
         ranges. CONFIG.rifle.bulletGravity is solved from that 6-unit
         spacing — moving these marks means recomputing it. -->
    <g stroke-width="0.65">
      <line x1="93"   y1="106" x2="107"   y2="106"/>
      <line x1="94.5" y1="112" x2="105.5" y2="112"/>
      <line x1="93"   y1="118" x2="107"   y2="118"/>
      <line x1="94.5" y1="124" x2="105.5" y2="124"/>
      <line x1="93"   y1="130" x2="107"   y2="130"/>
      <line x1="94.5" y1="136" x2="105.5" y2="136"/>
    </g>
    <g stroke-width="0.4">
      <line x1="98.4" y1="109" x2="101.6" y2="109"/>
      <line x1="98.4" y1="115" x2="101.6" y2="115"/>
      <line x1="98.4" y1="121" x2="101.6" y2="121"/>
      <line x1="98.4" y1="127" x2="101.6" y2="127"/>
      <line x1="98.4" y1="133" x2="101.6" y2="133"/>
    </g>
  </g>

  <!-- range labels, in hundreds of metres -->
  <g fill="#8f8a7e" font-family="'Courier New', monospace" font-size="4.4" text-anchor="start">
    <text x="109" y="107.6">1</text>
    <text x="109" y="119.6">3</text>
    <text x="109" y="131.6">5</text>
  </g>
  <!-- windage labels, same 6-unit steps as the ladder -->
  <g fill="#8f8a7e" font-family="'Courier New', monospace" font-size="4" text-anchor="middle">
    <text x="82"  y="96.2">2</text>
    <text x="70"  y="96.2">4</text>
    <text x="118" y="96.2">2</text>
    <text x="130" y="96.2">4</text>
  </g>

  <circle cx="100" cy="100" r="1.25" fill="#c67a3a"/>
</svg>
